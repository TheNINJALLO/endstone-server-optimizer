[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-server-optimizer"
version = "2.2.2"
description = "Server optimization plugin for Endstone Minecraft Bedrock"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.8,<0.12",
    "bedrock-protocol-packets-ng>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "psutil>=5.9.0"
]

[project.entry-points."endstone"]
server_optimizer = "server_optimizer:ServerOptimizerPlugin"

[tool.setuptools.packages.find]
where = ["src"]